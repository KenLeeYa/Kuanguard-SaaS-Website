[project]
name = "kuanguard"
version = "0.1.0"
description = "KUANGUARD private security service platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "redis>=5.2,<7",
  "defusedxml>=0.7.1,<1",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
  "pillow>=11,<13",
  "dnspython>=2.7,<3",
  "boto3>=1.35,<2",
  "pypdf>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
