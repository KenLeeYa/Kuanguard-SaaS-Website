# Mount only into the KUANGUARD public API gateway on its private container network.
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name api.kuanguard.com;
    client_max_body_size 4m;
    add_header Cache-Control "private, no-store" always;

    location = /health {
        proxy_set_header Host api.kuanguard.com;
        proxy_pass http://api:8180;
    }
    location ^~ /auth/dev/ { return 404; }
    location ^~ /auth/development/ { return 404; }
    location = /auth/portal/dev-complete { return 404; }
    location ~ ^/(auth|public|customer|learner|partner|webhooks|app/drafts)/ {
        proxy_set_header Host api.kuanguard.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_pass http://api:8180;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location / { return 404; }
}
