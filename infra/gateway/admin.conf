# Tunnel validates Access first. API independently validates JWT + app session/RBAC.
# Do not publish this gateway's port or give it an unprotected alternate hostname.
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name admin.kuanguard.com;
    client_max_body_size 4m;
    add_header Cache-Control "private, no-store" always;

    location /api/ {
        proxy_set_header Host admin.kuanguard.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_pass http://api:8180/;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location /internal/ {
        proxy_set_header Host admin.kuanguard.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_pass http://api:8180;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location / {
        proxy_set_header Host admin.kuanguard.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_pass http://web:3180;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
